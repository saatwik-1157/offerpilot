# Checks for the static site (apps/web) and the RezForge backend (apps/api, api/).
# Deployment is separate: pages.yml, which only runs on pushes to main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: Local links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --offline: only local files and #anchors are checked, so no network flakiness.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress 'apps/web/**/*.html'
          fail: true

  checks:
    name: JS syntax, HTML validity, API handler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check # node --check on every JS file (scripts/check-syntax.mjs)
      - name: html-validate (standard preset)
        run: npx --yes html-validate@11 --preset=standard $(git ls-files 'apps/web/*.html')
      # The Anthropic client is constructed at import time and needs a key to exist;
      # a dummy one is enough because the handler is never invoked (no network call).
      - name: Import RezForge handler and Vercel shim
        env:
          ANTHROPIC_API_KEY: dummy-ci-key
        run: |
          node --input-type=module -e '
            for (const f of ["./apps/api/functions/rezforge.js", "./api/rezforge.js"]) {
              const m = await import(f);
              if (typeof m.default !== "function") throw new Error(`${f}: no default-export handler`);
              console.log(`${f}: default export ok`);
            }'
