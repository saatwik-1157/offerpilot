<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
// This page is served for ANY missing path, at any depth, so its relative
// links ("css/styles.css") would otherwise resolve against that missing path
// rather than the site root. A <base> fixes that -- but the right value
// differs per host: GitHub Pages publishes this repo under /offerpilot/,
// while netlify.toml publishes it at the root. Hard-coding either one breaks
// the other, so derive it from the URL we were actually served at.
//
// Must run before the <link>/<script> tags below: only the first <base> in a
// document counts, and it only affects URLs resolved after it is inserted.
(function () {
  var el = document.createElement('base');
  el.href = location.pathname.indexOf('/offerpilot/') === 0 ? '/offerpilot/' : '/';
  document.head.appendChild(el);
})();
</script>
<title>Page not found — OfferPilot</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-chrome="off">
<div style="min-height:100vh;display:grid;place-items:center;background:var(--dark-bg);text-align:center;padding:24px">
  <div>
    <div class="grad-text" style="font-size:6rem;font-weight:900;line-height:1">404</div>
    <h1 style="color:#fff;margin:8px 0 10px">This page never landed.</h1>
    <p style="color:#AEB6D0;max-width:420px;margin:0 auto 24px">The link you followed doesn't exist — but your next opportunity might. Head back and keep the pipeline moving.</p>
    <a href="index.html" class="btn btn-primary btn-lg">← Back to home</a>
  </div>
</div>
</body>
</html>
